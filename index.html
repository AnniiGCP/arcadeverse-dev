    <script>
      (function() {
        const prefetchStats = function() {
          fetch('/api/stats', { 
            method: 'GET',
            cache: 'no-cache',
            priority: 'low'
          })
          .then(res => res.json())
          .then(data => {
            sessionStorage.setItem('statsCache', JSON.stringify(data));
          })
          .catch(() => {});
        };
        if ('requestIdleCallback' in window) {
          requestIdleCallback(prefetchStats, { timeout: 3000 });
        } else {
          window.addEventListener('load', prefetchStats, { once: true });
        }
      })();
    </script>
